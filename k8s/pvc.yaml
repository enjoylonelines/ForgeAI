apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: forgeai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName: local-path
