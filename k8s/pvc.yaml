apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data
  namespace: forgeai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName: local-path  # k3s 기본 스토리지 클래스
