[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeai"
version = "0.1.0"
description = "Manufacturing equipment log multi-agent RAG system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.2.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "ucimlrepo>=0.0.7",
    "langfuse>=2.0.0",
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-chroma>=0.1.0",
    "langgraph>=0.2.0",
    "streamlit>=1.35.0",
    "requests>=2.32.0",
    "plotly>=5.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: 실제 Ollama LLM을 호출하는 테스트 (run with '-m slow' or '--no-header -p no:warnings')",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
