# Docker Compose v2.1+ 필요 (service_completed_successfully 조건 사용)
# Docker Desktop 4.x / docker-compose CLI 2.1+ 에서 지원
# GitHub Actions: docker/compose-action@v2 이상 또는 setup-docker-buildx 조합 권장
services:
  # Ollama LLM 서버
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    # GPU 사용 시 아래 주석 해제
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # 모델 초기 다운로드 (최초 1회, 이후 볼륨 캐시)
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:7b && ollama pull nomic-embed-text"]
    restart: "no"

  # ForgeAI FastAPI 앱
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_PERSIST_DIR: /data/chroma
      LOG_LEVEL: INFO
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

volumes:
  ollama_data:   # Ollama 모델 캐시 (qwen2.5:7b ~4.7GB, nomic-embed-text ~270MB)
  chroma_data:   # ChromaDB 임베딩 퍼시스턴스
